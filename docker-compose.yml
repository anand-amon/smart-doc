version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartdoc-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: smartdoc-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: smartdoc-postgres
    restart: always
    environment:
      POSTGRES_USER: smartdoc
      POSTGRES_PASSWORD: smartdoc
      POSTGRES_DB: smartdoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: smartdoc-adminer
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
